<document>
<style>
.nerd {
	font-family: nerd;
	font-weight: normal;
}
#top {
	font-size: small;

	text {
		padding: 1 3;
	}
}
#bottom {
	font-size: x-small;
	align: middle;

	& > inline {
		align: middle;
	}

	text {
		padding: 0 0 4 0;

		&.description {
			padding: 0 0 4 5;
		}
	}

	.item {
		padding: 0 10 0 0;
	}

	inline.stick {
		height: 28;
		padding: 0 10;
		align: both;
		color: var(--color-background);
		background-color: var(--color-text);
		border-radius: 14;

		&.single {
			width: 28;
			padding: 0;
		}
	}

	#button-hints {
		text.button {
			text-outline-width: 0;
		}
	}
}
</style>
<template id="button-hint">
	<inline class="item">
		<inline class="stick"><text class="button"></text></inline>
		<text class="description"></text>
	</inline>
</template>
<!-- 特地设置成无色，以避免从主题应用默认的 --color-background 色。 -->
<block background-color="none">
	<block id="top" padding="10">
		<inline align="middle">
			<text font-weight="bold" id="title">状态栏</text>
			<spacer width="10"></spacer>
			<text id="cpu"></text>
			<spacer></spacer>
			<text class="nerd" id="wifi"></text>
			<text class="nerd" id="bluetooth"></text>
			<text class="nerd" id="speaker"></text>
			<text id="battery">100%</text>
			<text class="nerd" id="battery-charging-box">&#xf0e7;</text>
			<text id="time"></text>
		</inline>
	</block>
	<spacer></spacer>
	<inline id="bottom" padding="10 15">
		<inline id="button-hints" align="middle" display="false"></inline>
		<spacer></spacer>
		<text>&nbsp;</text>
	</inline>
</block>
</document>
