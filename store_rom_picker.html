<document>
<style>
#rom-list .selected {
	outline-width: 3;
	outline-color: var(--color-focus);
	background-color: var(--color-selection-background);
}
</style>
<template id="rom-item">
	<block padding="0 10" align="middle">
		<text class="name"></text>
		<text class="detail" font-size="x-small"></text>
	</block>
</template>
<inline align="both" background-color="none">
	<block border-width="3" border-color="var(--color-border)" background-color="var(--color-background)">
		<list id="rom-list" max-rows="6" row-height="80" padding="10"></list>
	</block>
</inline>
</document>
