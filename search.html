<document>
<style>
document {
	color: white;
}
#keyboard {
	font-size: 25;
}
#keyboard inline {
	align: both;
}
#keyboard button {
	align: both;
	width: 55;
	height: 55;
	background-color: green;
	border-width: 2;
}
#keyboard button.selected {
	outline-width: 1;
	outline-color: white;
}
#result .selected {
	outline-width: 3;
	outline-color: green;
	background-color: #174417;
}
</style>
<block id=here background-color="#000000E8" width="640" height="480" border-width="3" border-color="green" padding="20">
	<stack fill>
		<block id="search">
			<spacer></spacer>
			<block align="both">
				<inline border-width="3" border-color="green" padding="20" width="350">
					<text id="query"></text>
				</inline>
			</block>
			<spacer></spacer>
			<block id="keyboard">
				<inline>
					<button><text>q</text></button>
					<button><text>w</text></button>
					<button><text>e</text></button>
					<button><text>r</text></button>
					<button><text>t</text></button>
					<button><text>y</text></button>
					<button><text>u</text></button>
					<button><text>i</text></button>
					<button><text>o</text></button>
					<button><text>p</text></button>
				</inline>
				<inline>
					<button><text>a</text></button>
					<button><text>s</text></button>
					<button><text>d</text></button>
					<button><text>f</text></button>
					<button><text>g</text></button>
					<button><text>h</text></button>
					<button><text>j</text></button>
					<button><text>k</text></button>
					<button><text>l</text></button>
				</inline>
				<inline>
					<button><text>z</text></button>
					<button><text>x</text></button>
					<button><text>c</text></button>
					<button><text>v</text></button>
					<button><text>b</text></button>
					<button><text>n</text></button>
					<button><text>m</text></button>
				</inline>
			</block>
			<spacer></spacer>
			<inline align="both" font-size="15">
				<text>“A”输入，“B”删除，“X”搜索，“Y”关闭</text>
			</inline>
		</block>
		<stack id="result" fill>
			<scroll id="result-list" display="false" rows="5" cols="1" display="false">
			</scroll>
			<block id="result-status-wrapper" align="both">
				<text id="result-status" font-size="15"></text>
			</block>
		</stack>
	</stack>
</block>
</document>
