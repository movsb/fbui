<document>
<style>
document {
	color: white;
}
.nerd {
	font-family: nerd;
	bold: false;
}
#title-bar text {
	padding: 3;
}
#title-bar .selected {
	outline-width: 3;
	outline-color: green;
	background-color: #174417;
}
#content .content-item {
	display: false;
}
#content .content-item.selected {
	display: true;
}
#games .selected {
	outline-width: 3;
	outline-color: green;
	background-color: #174417;
	bold: true;
}
#ports .selected {
	outline-width: 3;
	outline-color: green;
	background-color: #174417;
	bold: true;
}
#apps .selected {
	outline-width: 3;
	outline-color: green;
	background-color: #174417;
	bold: true;
}
</style>
<block padding="10">
	<stack id="title-bar">
		<inline id="time-bar" align="middle">
			<text bold>小桃的吹米</text>
			<spacer width="5"></spacer>
			<text id="cpu"></text>
			<spacer></spacer>
			<text class="nerd" id="wifi"></text>
			<text class="nerd" id="bluetooth"></text>
			<text class="nerd" id="speaker"></text>
			<text id="battery">100%</text>
			<text class="nerd" id="battery-charging-box">&#xf0e7;</text>
			<text id="time"></text>
		</inline>
		<inline id="cat-bar">
			<spacer></spacer>
			<text class="selected" name="games">游戏</text>
			<spacer width="20"></spacer>
			<text name="ports">独立</text>
			<spacer width="20"></spacer>
			<text name="apps">应用</text>
			<spacer width="20"></spacer>
			<text name="system">系统</text>
			<spacer></spacer>
		</inline>
	</stack>
	<spacer height="10"></spacer>
	<stack id="content" spacer fill>
		<stack class="content-item selected" id="games" fill>
			<scroll id="emus" rows="2" cols="3" gap="30" padding="20">
			</scroll>
			<scroll id="roms" rows="5" cols="1" gap="30" display="false" padding="20">
			</scroll>
			<inline id="nogames" align="both" display="false">
				<text>没有游戏</text>
			</inline>
		</stack>
		<scroll class="content-item" id="ports" rows="2" cols="3" gap="30" padding="20">
		</scroll>
		<scroll class="content-item" id="apps" rows="2" cols="3" gap="30" padding="20">
		</scroll>
		<block class="content-item" id="system" background-color="yellow">
			<terminal spacer font-size="18" font-family="monospace"></terminal>
		</block>
	</stack>
</block>
</document>
