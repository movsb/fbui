<document>
<style>
document {
	color: white;
}
#title-bar .selected {
	background-color: black;
}
#content .content-item {
	display: false;
}
#content .content-item.selected {
	display: true;
}
#games .selected {
	background-image: 'nav-item-bg-f.png';
	bold: true;
}
#ports .selected {
	background-image: 'nav-item-bg-f.png';
	bold: true;
}
#apps .selected {
	background-image: 'nav-item-bg-f.png';
}
</style>
<block padding="10" background-image="bg.png">
	<stack id="title-bar">
		<inline id="time-bar">
			<text bold>TRIMUI</text>
			<spacer></spacer>
			<text id="battery">100%</text>
			<spacer width="10"></spacer>
			<text id="time"></text>
		</inline>
		<inline id="cat-bar">
			<spacer></spacer>
			<text class="selected" name="games">游戏</text>
			<spacer width="30"></spacer>
			<text name="ports">独立</text>
			<spacer width="30"></spacer>
			<text name="apps">应用</text>
			<spacer width="30"></spacer>
			<text name="system">系统</text>
			<spacer></spacer>
		</inline>
	</stack>
	<spacer height="10"></spacer>
	<stack id="content" spacer fill>
		<stack class="content-item selected" id="games" fill>
			<scroll id="emus" rows="2" cols="3" gap="30" padding="20">
			</scroll>
			<scroll id="roms" rows="5" cols="1" gap="30" display="false">
			</scroll>
		</stack>
		<scroll class="content-item" id="ports" rows="2" cols="3" gap="30" padding="20">
		</scroll>
		<scroll class="content-item" id="apps" rows="2" cols="3" gap="30" padding="20">
		</scroll>
		<block class="content-item" id="system" background-color="yellow">
			<terminal spacer font-size="18"></terminal>
		</block>
	</stack>
</block>
</document>
