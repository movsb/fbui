<document>
<style>
block {
	color: white;
}
#title-bar {
	color: white;
	background-color: black;
}
#title-bar .selected {
	background-color: white;
	color: black;
	bold: true;
}
#content .content-item {
	display: false;
}
#content .content-item.selected {
	display: true;
}
#games .selected {
	background-color: yellow;
	bold: true;
}
#ports .selected {
	background-color: yellow;
	bold: true;
}
#apps .selected {
	background-color: yellow;
}
</style>
<block padding="10">
	<stack id="title-bar">
		<inline id="time-bar">
			<text bold>TRIMUI</text>
			<spacer></spacer>
			<text id="battery">100%</text>
			<spacer width="10"></spacer>
			<text id="time"></text>
		</inline>
		<inline id="cat-bar">
			<spacer></spacer>
			<text class="selected" name="games">游戏</text>
			<spacer width="30"></spacer>
			<text name="ports">独立</text>
			<spacer width="30"></spacer>
			<text name="apps">应用</text>
			<spacer width="30"></spacer>
			<text name="system">系统</text>
			<spacer></spacer>
		</inline>
	</stack>
	<spacer height="10"></spacer>
	<stack id="content" spacer fill>
		<scroll class="content-item selected" id="games" background-color="red" rows="2" cols="3" gap="30" padding="20">
		</scroll>
		<scroll class="content-item" id="ports" background-color="green" rows="2" cols="3" gap="30" padding="20">
		</scroll>
		<scroll class="content-item" id="apps" background-color="blue" rows="2" cols="3" gap="30" padding="20">
		</scroll>
		<block class="content-item" id="system" background-color="yellow">
			<terminal spacer></terminal>
		</block>
	</stack>
</block>
</document>
