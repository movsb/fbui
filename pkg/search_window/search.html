<document>
<style>
#keyboard {
	font-size: 25;

	inline {
		align: both;
	}
	button {
		padding: 0;
		color: var(--color-text);
		align: both;
		width: 55;
		height: 55;
		background-color: var(--color-primary);
		border-width: 2;
		border-color: none;

		&.selected {
			outline-width: 1;
			outline-color: var(--color-focus);
		}
	}
}
#result {
	.selected {
		outline-width: 3;
		outline-color: var(--color-focus);
		background-color: var(--color-selection-background);
	}
}
</style>
<template id="search-result-item">
	<block padding="0 20" align="middle">
		<inline><text class="name" font-size="small"></text></inline>
		<inline><text class="path" font-size="x-small"></text></inline>
	</block>
</template>
<block width="640" height="480" border-width="3" border-color="var(--color-border)" padding="20">
	<stack fill>
		<block id="search">
			<spacer></spacer>
			<block align="both">
				<inline border-width="3" border-color="var(--color-border)" padding="10" width="350">
					<text id="query"></text>
				</inline>
			</block>
			<spacer></spacer>
			<block id="keyboard">
				<inline>
					<button><text>q</text></button>
					<button><text>w</text></button>
					<button><text>e</text></button>
					<button><text>r</text></button>
					<button><text>t</text></button>
					<button><text>y</text></button>
					<button><text>u</text></button>
					<button><text>i</text></button>
					<button><text>o</text></button>
					<button><text>p</text></button>
				</inline>
				<inline>
					<button><text>a</text></button>
					<button><text>s</text></button>
					<button><text>d</text></button>
					<button><text>f</text></button>
					<button><text>g</text></button>
					<button><text>h</text></button>
					<button><text>j</text></button>
					<button><text>k</text></button>
					<button><text>l</text></button>
				</inline>
				<inline>
					<button><text>z</text></button>
					<button><text>x</text></button>
					<button><text>c</text></button>
					<button><text>v</text></button>
					<button><text>b</text></button>
					<button><text>n</text></button>
					<button><text>m</text></button>
				</inline>
			</block>
			<spacer></spacer>
			<inline align="both" font-size="x-small" font-family="monospace">
				<text>“A”输入，“B”删除，“X”搜索，“Y”关闭</text>
			</inline>
		</block>
		<stack id="result" fill>
			<list id="result-list" display="false" rows="5" cols="1" display="false">
			</list>
			<block id="result-status-wrapper" align="both">
				<text id="result-status" font-size="small"></text>
			</block>
		</stack>
	</stack>
</block>
</document>
