<document>
<title>文件管理器</title>
<style>
document {
	color: white;
}
.nerd {
	font-family: nerd;
}
.mono {
	font-family: monospace;
}
scroll .selected {
	outline-width: 3;
	outline-color: deeppink;
	background-color: #882b5d;
}
</style>
<stack fill>
	<safe-area>
		<stack fill background-color="#000000E8">
			<stack padding="10 20" fill>
				<scroll id="scroll" rows="8" cols="1"></scroll>
				<block id="empty" align="both" display="false">
					<text><i>没有内容</i></text>
				</block>
			</stack>
		</stack>
	</safe-area>
	<!-- 预览窗口全屏挺好看的 -->
	<stack id="preview" fill background-color="clear" display="false">
		<img fill="scale-down">
		<video></video>
		<audio></audio>
		<safe-area>
			<text class="mono" padding="10" font-size="small"></text>
		</safe-area>
	</stack>
</stack>
</document>
