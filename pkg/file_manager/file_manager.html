<document>
<title>文件管理器</title>
<style>
document {
	color: white;
}
.nerd {
	font-family: nerd;
}
.mono {
	font-family: monospace;
}
scroll {
	.selected {
		outline-width: 3;
		outline-color: var(--color-focus);
		background-color: var(--color-selection-background);
	}
}
</style>
<template id="file-item">
	<block padding="0 20">
		<inline spacer align="middle">
			<inline class="icon">
				<text class="nerd">&#xf07b;</text>
				<spacer width="10"></spacer>
			</inline>
			<text class="name"></text>
		</inline>
	</block>
</template>
<stack fill>
	<inline font-size="small" align="center" padding="10"><text id="pagination"></text></inline>
	<safe-area>
		<stack padding="10 20" fill background-color="#000000E8">
			<block id="here">
				<inline padding="10 0" font-size="small"><text id="path"></text></inline>
				<scroll id="scroll" rows="8" cols="1" spacer></scroll>
				<stack id="stat" padding="10 0" font-size="small" class="mono">
					<inline align="both">
						<text class="time"></text>
						<spacer></spacer>
						<text class="perm"></text>
					</inline>
					<inline align="both">
						<spacer></spacer>
						<text class="size"></text>
						<spacer></spacer>
					</inline>
				</stack>
			</block>
			<block id="empty" align="both" display="false">
				<text><i>没有内容</i></text>
			</block>
		</stack>
	</safe-area>
	<!-- 预览窗口全屏挺好看的，放到安全区域外吧 -->
	<stack id="preview" fill background-color="clear" display="false">
		<img fill="scale-down">
		<video></video>
		<audio></audio>
		<safe-area>
			<text class="mono" padding="10" font-size="small"></text>
		</safe-area>
	</stack>
</stack>
</document>
