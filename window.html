<document>
<style>
document {
	color: white;
}
.nerd {
	font-family: nerd;
	bold: false;
}
#cat-bar {
	font-size: small;
}
#cat-bar text {
	padding: 0 5 2 5;
}
#cat-bar.active .selected {
	outline-width: 3;
	outline-color: deeppink;
	background-color: #882b5d;
}
#content .content-item {
	display: false;
}
#content .content-item.selected {
	display: true;
}
#games .selected {
	outline-width: 3;
	outline-color: deeppink;
	background-color: #882b5d;
	bold: true;
}
#ports .selected {
	outline-width: 3;
	outline-color: deeppink;
	background-color: #882b5d;
	bold: true;
}
#apps .selected {
	outline-width: 3;
	outline-color: deeppink;
	background-color: #882b5d;
	bold: true;
}
#tools .selected {
	outline-width: 3;
	outline-color: deeppink;
	background-color: #882b5d;
	bold: true;
}
#store .selected {
	outline-width: 3;
	outline-color: deeppink;
	background-color: #882b5d;
	bold: true;
}
</style>
<title>小桃的吹米</title>
<stack fill>
	<stack>
		<inline id="cat-bar" padding="10">
			<spacer></spacer>
			<text class="selected" name="games">游戏</text>
			<text name="ports">独立</text>
			<text name="apps">应用</text>
			<text name="system">终端</text>
			<text name="tools">工具</text>
			<text name="store">仓库</text>
			<spacer></spacer>
		</inline>
		<block align="both" padding="10" width="100%">
			<text font-size="small" id="pagination"></text>
		</block>
	</stack>
	<safe-area>
		<stack id="content" spacer fill>
			<stack class="content-item selected" id="games" fill>
				<scroll id="emus" rows="2" cols="3" gap="30" padding="20">
				</scroll>
				<scroll id="roms" rows="8" cols="1" gap="10" display="false" padding="20">
				</scroll>
				<inline id="nogames" align="both" display="false">
					<text>没有游戏</text>
				</inline>
			</stack>
			<scroll class="content-item" id="ports" rows="2" cols="3" gap="30" padding="20">
			</scroll>
			<scroll class="content-item" id="apps" rows="2" cols="3" gap="30" padding="20">
			</scroll>
			<block class="content-item" id="system" background-color="yellow" padding="10">
				<terminal spacer font-size="18" font-family="monospace"></terminal>
			</block>
			<scroll class="content-item" id="tools" rows="8" cols="1" gap="10" padding="30">
			</scroll>
			<block class="content-item" id="store" fill>
				<inline padding="10 20" font-size="small"><text id="store-title">仓库</text></inline>
				<stack fill>
					<scroll id="store-list" rows="8" cols="1" gap="10" padding="20" spacer></scroll>
					<block id="store-message" align="both" display="false"><text align="center"></text></block>
				</stack>
			</block>
		</stack>
	</safe-area>
	<stack id="store-preview" fill background-color="clear" display="false">
		<img fill="scale-down">
		<video></video>
	</stack>
</stack>
</document>
