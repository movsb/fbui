<document>
<style>
.nerd {
	font-family: nerd;
	font-weight: normal;
}
#cat-bar {
	font-size: small;

	text {
		padding: 0 5 2 5;
	}
	&.active .selected {
		outline-width: 3;
		outline-color: var(--color-focus);
		background-color: var(--color-selection-background);
		border-radius: 8;
	}
}
#content {
	.content-item {
		display: false;

		&.selected {
			display: true;
		}
	}
}
#games, #ports, #apps, #tools, #store {
	.selected {
		outline-width: 3;
		outline-color: var(--color-focus);
		background-color: var(--color-selection-background);
		border-radius: 8;
		font-weight: bold;
	}
}
#common {
	.selected {
		outline-width: 3;
		outline-color: var(--color-focus);
		border-radius: 8;
		font-weight: bold;
	}
	.active-column .selected {
		background-color: var(--color-selection-background);
	}
}

</style>
<title>小桃的吹米</title>
<template id="app-item">
	<block align="center" padding="20">
		<img spacer aspect-ratio=1 border-radius="30" trim-transparent-border trim-black-border>
		<spacer height="10"></spacer>
		<text align=center marquee="horizontal" marquee-count="1"></text>
	</block>
</template>
<template id="saved-item">
	<block padding="0 10" align="middle">
		<text class="name" marquee="horizontal" marquee-count="1"></text>
		<text class="sublabel" font-size="x-small"></text>
	</block>
</template>
<template id="emu-item">
	<block align="center" padding="20">
		<img spacer fill="contain" trim-transparent-border trim-black-border>
		<spacer height="10"></spacer>
		<text align="center" marquee="horizontal" marquee-count="1"></text>
	</block>
</template>
<template id="rom-item">
	<block padding="0 10">
		<inline spacer align="middle">
			<inline class="icon">
				<text class="nerd">&#xf07b;</text>
				<spacer width="10"></spacer>
			</inline>
			<text class="name" marquee=horizontal marquee-count=1></text>
		</inline>
	</block>
</template>
<template id="tool-item">
	<block padding="10">
		<inline spacer align="middle"><text></text></inline>
	</block>
</template>
<template id="store-item">
	<block padding="0 10">
		<inline spacer align="middle">
			<text class="name" marquee=horizontal marquee-count=1></text>
		</inline>
	</block>
</template>
<template id="store-icon-item">
	<block align="center" padding="20">
		<img spacer aspect-ratio="1" fill="contain" border-radius="20">
		<spacer height="10"></spacer>
		<text class="name" align="center" marquee="horizontal" marquee-count="1"></text>
	</block>
</template>
<template id="store-series-game-item">
	<block padding="0 10">
		<inline spacer align="middle">
			<text class="name" spacer marquee=horizontal marquee-count=1></text>
			<spacer width="10"></spacer>
			<text class="platform" font-size="small"></text>
		</inline>
	</block>
</template>
<template id="store-asset-item">
	<block padding="0 10" align="middle">
		<text class="name" marquee=horizontal marquee-count=1></text>
		<text class="detail" font-size="x-small"></text>
	</block>
</template>
<stack fill>
	<img id="wallpaper" fill="contain" src="assets/wallpaper.png">
	<stack id="store-background" fill background-color="none" display="false">
		<!-- <block background-color="var(--color-background)"></block> -->
		<img fill="stretch">
	</stack>
	<stack>
		<inline id="cat-bar" padding="10">
			<spacer></spacer>
			<text name="common">常用</text>
			<text class="selected" name="games">游戏</text>
			<text name="ports">独立</text>
			<text name="apps">应用</text>
			<text name="tools">工具</text>
			<spacer></spacer>
		</inline>
		<block align="both" padding="10" width="100%">
			<text font-size="small" id="pagination"></text>
		</block>
	</stack>
	<safe-area>
		<stack id="content" spacer fill>
			<inline class="content-item" id="common" fill padding="10">
				<block id="common-recent" spacer height="100%">
					<stack spacer fill>
						<list rows="6" cols="1" gap="10" padding="10"></list>
						<inline class="empty" width="100%" height="100%" align="both" display="false"><text font-size="small">没有最近项目</text></inline>
					</stack>
				</block>
				<spacer width="20"></spacer>
				<block id="common-favorites" spacer height="100%">
					<stack spacer fill>
						<list rows="6" cols="1" gap="10" padding="10"></list>
						<inline class="empty" width="100%" height="100%" align="both" display="false"><text font-size="small">没有收藏项目</text></inline>
					</stack>
				</block>
			</inline>
			<stack class="content-item selected" id="games" fill>
				<list id="emus" rows="2" cols="3" gap="30" padding="20"></list>
				<list id="roms" rows="8" cols="1" gap="10" display="false" padding="20"></list>
				<inline id="nogames" align="both" display="false">
					<text>没有游戏</text>
				</inline>
			</stack>
			<list class="content-item" id="ports" rows="2" cols="3" gap="30" padding="20"></list>
			<list class="content-item" id="apps" rows="2" cols="3" gap="30" padding="20"></list>
			<list class="content-item" id="tools" rows="8" cols="1" gap="10" padding="30"></list>
			<block class="content-item" id="store" fill>
				<!-- <inline padding="10 20" font-size="small"><text id="store-title">仓库</text></inline> -->
				<stack fill>
					<list id="store-icon-list" rows="2" cols="3" gap="30" padding="20" spacer display="false"></list>
					<list id="store-list" rows="8" cols="1" gap="10" padding="20" spacer></list>
					<list id="store-series-list" rows="8" cols="1" gap="10" padding="20" spacer display="false"></list>
					<list id="store-release-list" rows="8" cols="1" gap="10" padding="20" spacer display="false"></list>
					<list id="store-asset-list" rows="6" cols="1" gap="10" padding="20" spacer display="false"></list>
					<block id="store-message" align="both" display="false"><text align="center"></text></block>
				</stack>
			</block>
		</stack>
	</safe-area>
	<stack id="store-preview" fill background-color="clear" display="false">
		<img fill="contain">
	</stack>
</stack>
</document>
