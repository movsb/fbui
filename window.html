<document>
<style>
.nerd {
	font-family: nerd;
	bold: false;
}
#cat-bar {
	font-size: small;

	text {
		padding: 0 5 2 5;
	}
	&.active .selected {
		outline-width: 3;
		outline-color: var(--color-focus);
		background-color: var(--color-selection-background);
		border-radius: 8;
	}
}
#content {
	.content-item {
		display: false;

		&.selected {
			display: true;
		}
	}
}
#games, #ports, #apps, #tools, #store {
	.selected {
		outline-width: 3;
		outline-color: var(--color-focus);
		background-color: var(--color-selection-background);
		border-radius: 8;
		bold: true;
	}
}
</style>
<title>小桃的吹米</title>
<template id="app-item">
	<block align="center" padding="30">
		<img spacer aspect-ratio=1 border-radius="30">
		<spacer height="10"></spacer>
		<text align=center marquee="horizontal" marquee-count="1"></text>
	</block>
</template>
<template id="emu-item">
	<block align="center" padding="20">
		<img spacer fill="contain">
		<spacer height="10"></spacer>
		<text align="center" marquee="horizontal" marquee-count="1"></text>
	</block>
</template>
<template id="rom-item">
	<block padding="0 10">
		<inline spacer align="middle">
			<inline class="icon">
				<text class="nerd">&#xf07b;</text>
				<spacer width="10"></spacer>
			</inline>
			<text class="name" marquee=horizontal marquee-count=1></text>
		</inline>
	</block>
</template>
<template id="tool-item">
	<block padding="10">
		<inline spacer align="middle"><text></text></inline>
	</block>
</template>
<template id="store-item">
	<block padding="0 10">
		<inline spacer align="middle">
			<text class="name" marquee=horizontal marquee-count=1></text>
		</inline>
	</block>
</template>
<stack fill>
	<stack>
		<inline id="cat-bar" padding="10">
			<spacer></spacer>
			<text class="selected" name="games">游戏</text>
			<text name="ports">独立</text>
			<text name="apps">应用</text>
			<text name="tools">工具</text>
			<text name="store">仓库</text>
			<spacer></spacer>
		</inline>
		<block align="both" padding="10" width="100%">
			<text font-size="small" id="pagination"></text>
		</block>
	</stack>
	<safe-area>
		<stack id="content" spacer fill>
			<stack class="content-item selected" id="games" fill>
				<list id="emus" rows="2" cols="3" gap="30" padding="20"></list>
				<list id="roms" rows="8" cols="1" gap="10" display="false" padding="20"></list>
				<inline id="nogames" align="both" display="false">
					<text>没有游戏</text>
				</inline>
			</stack>
			<list class="content-item" id="ports" rows="2" cols="3" gap="30" padding="20"></list>
			<list class="content-item" id="apps" rows="2" cols="3" gap="30" padding="20"></list>
			<list class="content-item" id="tools" rows="8" cols="1" gap="10" padding="30"></list>
			<block class="content-item" id="store" fill>
				<inline padding="10 20" font-size="small"><text id="store-title">仓库</text></inline>
				<stack fill>
					<list id="store-list" rows="8" cols="1" gap="10" padding="20" spacer></list>
					<block id="store-message" align="both" display="false"><text align="center"></text></block>
				</stack>
			</block>
		</stack>
	</safe-area>
	<stack id="store-preview" fill background-color="clear" display="false">
		<img fill="contain">
		<video></video>
	</stack>
</stack>
</document>
